name: Testler
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  vtracer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: VTracer köprüsü testleri (2.000 rastgele görselle dayanıklılık dahil)
        run: cargo test --release
        working-directory: tools/vtracer-wasm
